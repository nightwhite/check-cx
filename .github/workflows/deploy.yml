name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: f9e91018fad41a22e100bed93be1a7d1
  CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Apply D1 migrations
        if: env.CF_TOKEN_SET == 'true'
        run: pnpm exec wrangler d1 migrations apply check-cx --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        if: env.CF_TOKEN_SET == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
